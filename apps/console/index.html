<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6A4CF5" />
    <title>EduNest Console</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%236A4CF5'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='18' font-weight='800' text-anchor='middle' fill='white'%3EE%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>html,body{margin:0;background:#E9E5FB}@media (prefers-color-scheme:dark){html,body{background:#07060B}}</style>
    <script>
      // Set the theme before the first paint so there is no flash.
      try { var t = localStorage.getItem('edunest.theme'); document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); if (document.documentElement.dataset.theme === 'dark') document.documentElement.style.background = '#07060B'; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
