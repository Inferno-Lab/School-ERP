name: edunest
description: EduNest — a school app for students, parents, and teachers.
publish_to: 'none'
version: 2.0.0+210

environment:
  sdk: ^3.11.5

dependencies:
  cached_network_image: ^3.4.1
  camera: ^0.12.1
  connectivity_plus: ^7.0.0
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  get: ^4.7.2
  get_storage: ^2.1.1
  image_picker: ^1.2.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  # Vendored: 2.1.0 on pub extends IconData, which is final on this Flutter.
  phosphor_flutter:
    path: packages/phosphor_flutter
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.7.1
  flutter_test:
    sdk: flutter
  json_serializable: ^6.11.1
  mocktail: ^1.0.4
  very_good_analysis: ^10.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/mock/
    - assets/images/
    - assets/icons/
  shaders:
    - shaders/liquid_glass.frag
  fonts:
    - family: AnekLatin
      fonts:
        - asset: assets/fonts/AnekLatin.ttf
    - family: AnekDevanagari
      fonts:
        - asset: assets/fonts/AnekDevanagari.ttf
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
