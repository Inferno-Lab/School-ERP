# One free web service runs everything on the test track: the school API, the console API, the school admin (at /) and the console (at /console/).
# Connect this repository in Render (New > Blueprint) and fill in the values marked "sync: false" when asked. Steps: docs/deploy-free-test.md
services:
  - type: web
    name: edunest
    runtime: node
    plan: free
    region: singapore
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && CONSOLE_BASE=/console/ pnpm exec turbo run build --concurrency=2
    startCommand: node apps/server/dist/main.js
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # A Neon database for the registry (the list of schools) and for the schools themselves. Use the direct connection string, not the pooled one.
      - key: REGISTRY_DATABASE_URL
        sync: false
      - key: SHARED_PG_ADMIN_URL
        sync: false
      # Generated once by Render. Changing SECRETS_KEY later makes every school's stored connection unreadable.
      - key: SECRETS_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: BUILD_CALLBACK_TOKEN
        generateValue: true
      # How you sign in to the console. The password is generated; read it under Environment once the service exists.
      - key: BOOTSTRAP_EMAIL
        value: kaushal@edunest.app
      - key: BOOTSTRAP_PASSWORD
        generateValue: true
      # The six-digit code the console asks for after the password. There is no email service on the test track, so you choose it.
      - key: DEMO_CODE
        sync: false
      - key: SEED_DEMO
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
