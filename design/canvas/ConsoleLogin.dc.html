<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Console sign in</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="nest.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#07060B}</style>
</helmet>
<div style="width: 100%; min-height: 900px; background: #07060B;">
  <dc-import name="AdminLogin" product="console" theme="dark" reduce-motion="{{rm}}" hint-size="100%,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"reduceMotion":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return { rm: !!this.props.reduceMotion }; }
}
</script>
</body>
</html>
