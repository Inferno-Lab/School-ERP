<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin on a phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="nest.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ph{position:relative;width:100%;height:844px;overflow:hidden;display:flex;flex-direction:column}
.ph .top{display:flex;align-items:center;gap:12px;padding:20px 20px 8px}
.ph .top h1{margin:0;font:700 26px/1.05 var(--fd);letter-spacing:-.03em}
.ph .top small{display:block;font:600 13px var(--fb);color:var(--ink3);margin-bottom:2px}
.ph .sc{flex:1;overflow:auto;padding:8px 16px 120px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
.ph .sc::-webkit-scrollbar{display:none}
.bt{border-radius:26px;padding:18px;position:relative;overflow:hidden;animation:nRise .7s var(--e) both;animation-delay:var(--d,0s)}
.bt.a{background:var(--a);color:#3A2600}
.bt.v{background:var(--v);color:#fff}
.bt.k{background:var(--ci);color:#fff}
.bt.w{background:var(--card);border:1px solid var(--line)}
.bt small{display:block;font:700 12.5px var(--fb);opacity:.75}
.bt .n{font:800 40px/1 var(--fd);letter-spacing:-.04em;margin-top:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ap{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);transition:opacity .4s,transform .5s var(--e)}
.ap:first-of-type{border-top:0}
.ap.gone{opacity:.35}
.ap.gone b{text-decoration:line-through}
.ap b{display:block;font:700 14.5px var(--fb)}
.ap small{font:500 12.5px var(--fb);color:var(--ink3)}
.dock{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:999px;background:var(--ci);box-shadow:0 20px 40px -12px rgba(30,15,90,.55)}
.dock button{position:relative;width:56px;height:52px;border-radius:999px;border:0;background:none;color:#B4AFCB;display:grid;place-items:center;cursor:pointer;transition:color .3s,width .5s var(--e),background .3s}
.dock button.on{width:104px;background:var(--v);color:#fff}
.dock button svg{width:22px;height:22px;grid-area:1/1}
.dock button span{grid-area:1/1;font:800 13px var(--fb);margin-left:30px;opacity:0;max-width:0;overflow:hidden;white-space:nowrap;transition:opacity .3s}
.dock button.on span{opacity:1;max-width:60px}
.dock button.on svg{margin-right:44px}
.bell{position:relative}
.bell i{position:absolute;right:8px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px var(--frame)}
</style>
</helmet>
<div class="nest {{themeCls}} {{rmCls}}" style="width: 100%;">
  <div class="ph fr" style="border-radius: 0; border: 0; background: var(--frame);">
    <div class="top"><span class="lg" style="width: 44px; height: 44px; font-size: 20px;">G</span><div style="flex: 1;"><small>Wednesday 14 Oct</small><h1>Good morning, Meera</h1></div><button class="mini bell" aria-label="Notifications"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="i" d="M12 4a6 6 0 0 0-6 6c0 5-2 6-2 6h16s-2-1-2-6a6 6 0 0 0-6-6M10 20a2 2 0 0 0 4 0"></path></svg><i></i></button></div>
    <div class="sc">
      <div class="two">
        <div class="bt a" style="--d: .02s;"><small>Present today</small><div class="n num">38<span style="font-size: 20px; opacity: .6;">/42</span></div></div>
        <div class="bt v" style="--d: .06s;"><small>Fees this week</small><div class="n num">₹18L</div></div>
      </div>
      <div class="bt w" style="--d: .1s; display: flex; align-items: center; gap: 12px; padding: 14px 18px;"><div style="width: 90px; flex: none;"><dc-import name="Nesti" scene="wave" hint-size="90px,80px"></dc-import></div><div><b class="fd" style="font-size: 18px; letter-spacing: -.02em;">Term 1 is on track</b><p style="margin: 4px 0 0; font: 500 13.5px/1.45 var(--fb); color: var(--ink2);">4 absent today, 3 things need you.</p></div></div>
      <div class="bt w" style="--d: .14s;"><div style="display: flex; align-items: center; margin-bottom: 4px;"><b class="fd" style="font-size: 18px; letter-spacing: -.02em;">Needs you</b><span class="chip c" style="margin-left: auto;">{{left}} left</span></div>
        <sc-for list="{{items}}" as="it" hint-placeholder-count="3"><div class="ap {{it.cls}}"><span class="av" style="background: {{it.bg}}; color: {{it.fg}};">{{it.i}}</span><div style="flex: 1; min-width: 0;"><b>{{it.t}}</b><small>{{it.s}}</small></div><button class="btn" style="height: 36px; padding: 0 16px;" onClick="{{it.go}}">{{it.l}}</button></div></sc-for>
        <sc-if value="{{clear}}" hint-placeholder-val="{{false}}"><div style="text-align: center; padding: 8px 0;"><div style="width: 120px; margin: 0 auto;"><dc-import name="Nesti" scene="party" hint-size="120px,110px"></dc-import></div><b class="fd" style="font-size: 18px;">All caught up</b></div></sc-if></div>
      <div class="bt k" style="--d: .18s;"><small>Fees collected</small><div style="display: flex; align-items: flex-end; gap: 6px; height: 70px; margin-top: 12px;"><sc-for list="{{pens}}" as="h"><i style="flex: 1; height: {{h.h}}%; border-radius: 6px 6px 3px 3px; background: {{h.c}};"></i></sc-for></div></div>
    </div>
    <nav class="dock" aria-label="Main"><sc-for list="{{tabs}}" as="t" hint-placeholder-count="4"><button class="{{t.on}}" onClick="{{t.go}}" aria-label="{{t.n}}"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="i" d="{{t.ic}}"></path></svg><span>{{t.n}}</span></button></sc-for></nav>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"reduceMotion":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
var IT = [['LR', 'Leave request', 'Riya Mehta, 8 A, 2 days', '#FFE9E2', '#B8381A'], ['FE', 'Fee waiver', 'Karan Shah, 6 C', '#FFF3D1', '#8A5A00'], ['AD', 'Admission', 'Ishaan Rao, grade 1', '#E3EAFE', '#2449C8']];
var TABS = [['Home', 'M4 11l8-7 8 7v9H4zM9 20v-6h6v6'], ['People', 'M5.5 8a3.5 3.5 0 1 0 7 0a3.5 3.5 0 1 0-7 0M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5'], ['Money', 'M12 3v18M7 8c0-2 2-3 5-3s5 1 5 3-2 3-5 3-5 1-5 3 2 3 5 3 5-1 5-3'], ['More', 'M5 12h.01M12 12h.01M19 12h.01']];
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { done: [], tab: 0 }; }
  renderVals() {
    var self = this; var s = this.state; var p = this.props;
    var left = IT.length - s.done.length;
    return {
      themeCls: p.theme === 'dark' ? 'dark' : '', rmCls: p.reduceMotion ? 'rm' : '',
      left: left, clear: left === 0, pens: [40, 55, 48, 70, 62, 88, 100].map(function (h) { return { h: h, c: h > 80 ? 'var(--v)' : 'rgba(255,255,255,.18)' }; }),
      items: IT.map(function (x, i) { var d = s.done.indexOf(i) >= 0; return { i: x[0], t: x[1], s: x[2], bg: x[3], fg: x[4], cls: d ? 'gone' : '', l: d ? 'Undo' : 'Approve', go: function () { self.setState({ done: d ? s.done.filter(function (j) { return j !== i; }) : s.done.concat(i) }); } }; }),
      tabs: TABS.map(function (t, i) { return { n: t[0], ic: t[1], on: s.tab === i ? 'on' : '', go: function () { self.setState({ tab: i }); } }; })
    };
  }
}
</script>
</body>
</html>
