<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nesti the bird</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="nest.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 100%; max-width: 560px;">
<svg class="mc s-{{scene}}" viewBox="0 0 270 220" role="img" aria-label="{{label}}">
  <ellipse cx="130" cy="207" rx="58" ry="6" style="fill: var(--ink, #14111F); opacity: .08"></ellipse>

  <sc-if value="{{isParty}}" hint-placeholder-val="{{false}}">
    <g>
      <rect class="cf" x="30" y="20" width="9" height="5" rx="1" style="fill: var(--v, #6A4CF5); --d: 0s"></rect>
      <circle class="cf" cx="62" cy="14" r="3.4" style="fill: var(--a, #FFC23D); --d: .5s"></circle>
      <rect class="cf" x="92" y="10" width="9" height="5" rx="1" style="fill: var(--c, #FF7A59); --d: 1.1s"></rect>
      <path class="cf" d="M120 6l5 9h-10z" style="fill: var(--g, #17A673); --d: .2s"></path>
      <circle class="cf" cx="150" cy="12" r="3.4" style="fill: var(--v, #6A4CF5); --d: 1.6s"></circle>
      <rect class="cf" x="176" y="8" width="9" height="5" rx="1" style="fill: var(--a, #FFC23D); --d: .8s"></rect>
      <path class="cf" d="M206 8l5 9h-10z" style="fill: var(--c, #FF7A59); --d: 1.3s"></path>
      <circle class="cf" cx="234" cy="16" r="3.4" style="fill: var(--b, #3B82F6); --d: .3s"></circle>
      <rect class="cf" x="46" y="40" width="9" height="5" rx="1" style="fill: var(--b, #3B82F6); --d: 2s"></rect>
      <circle class="cf" cx="108" cy="30" r="3" style="fill: var(--g, #17A673); --d: 2.3s"></circle>
      <rect class="cf" x="196" y="34" width="9" height="5" rx="1" style="fill: var(--v, #6A4CF5); --d: 1.9s"></rect>
      <path class="cf" d="M250 36l5 9h-10z" style="fill: var(--a, #FFC23D); --d: 2.6s"></path>
      <circle class="cf" cx="18" cy="52" r="3" style="fill: var(--c, #FF7A59); --d: 1.4s"></circle>
    </g>
  </sc-if>

  <sc-if value="{{isLost}}" hint-placeholder-val="{{false}}">
    <text class="q" x="52" y="78">?</text>
    <text class="q" x="206" y="66" style="animation-delay: -1.2s">?</text>
  </sc-if>

  <g class="nope"><g class="tilt"><g transform="translate({{dx}} 0)"><g class="bob">
    <path transform="translate(8 7)" d="M70 134C62 90 94 60 132 62C170 64 196 92 190 134C186 168 160 188 130 188C100 188 74 170 70 134Z" style="fill: var(--m-off, #FFD36B)"></path>
    <path d="M112 188v13M103 201h18M148 188v13M139 201h18" style="fill: none; stroke: var(--ink, #14111F); stroke-width: 3.2; stroke-linecap: round"></path>
    <path d="M70 134C62 90 94 60 132 62C170 64 196 92 190 134C186 168 160 188 130 188C100 188 74 170 70 134Z" style="fill: var(--m-body, #D9D1FF); stroke: var(--ink, #14111F); stroke-width: 2.8; stroke-linejoin: round"></path>
    <ellipse cx="130" cy="160" rx="35" ry="23" style="fill: var(--m-belly, #FFF5DA)"></ellipse>
    <g class="wL"><path d="M74 130C50 128 42 154 58 166C70 172 84 162 86 148Z" style="fill: var(--m-wing, #B9ACFF); stroke: var(--ink, #14111F); stroke-width: 2.6; stroke-linejoin: round"></path></g>
    <g class="wR"><path d="M186 130C210 128 218 154 202 166C190 172 176 162 174 148Z" style="fill: var(--m-wing, #B9ACFF); stroke: var(--ink, #14111F); stroke-width: 2.6; stroke-linejoin: round"></path></g>
    <circle cx="90" cy="128" r="6.5" style="fill: var(--c, #FF7A59); opacity: .5"></circle>
    <circle cx="170" cy="128" r="6.5" style="fill: var(--c, #FF7A59); opacity: .5"></circle>
    <sc-if value="{{eyesOpen}}" hint-placeholder-val="{{true}}">
      <g class="eye"><circle cx="110" cy="106" r="13" style="fill: #fff; stroke: var(--ink, #14111F); stroke-width: 2.6"></circle><g class="pup"><circle cx="112" cy="108" r="5.6" style="fill: #14111F"></circle><circle cx="110" cy="105.6" r="1.9" style="fill: #fff"></circle></g></g>
      <g class="eye"><circle cx="150" cy="106" r="13" style="fill: #fff; stroke: var(--ink, #14111F); stroke-width: 2.6"></circle><g class="pup"><circle cx="152" cy="108" r="5.6" style="fill: #14111F"></circle><circle cx="150" cy="105.6" r="1.9" style="fill: #fff"></circle></g></g>
    </sc-if>
    <sc-if value="{{eyesHappy}}" hint-placeholder-val="{{false}}">
      <path d="M97 110Q110 94 123 110M137 110Q150 94 163 110" style="fill: none; stroke: var(--ink, #14111F); stroke-width: 3.6; stroke-linecap: round"></path>
    </sc-if>
    <path d="M121 124h18l-9 13z" style="fill: var(--a, #FFC23D); stroke: var(--ink, #14111F); stroke-width: 2.4; stroke-linejoin: round"></path>
    <path d="M106 70v14Q130 95 154 84V70" style="fill: var(--m-cap, #2A2150); stroke: var(--ink, #14111F); stroke-width: 2.4; stroke-linejoin: round"></path>
    <path d="M88 62L130 44L172 62L130 78Z" style="fill: var(--m-cap, #2A2150); stroke: var(--ink, #14111F); stroke-width: 2.6; stroke-linejoin: round"></path>
    <path d="M172 62L178 74V96" style="fill: none; stroke: var(--a, #FFC23D); stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round"></path>
    <circle cx="178" cy="100" r="5" style="fill: var(--a, #FFC23D); stroke: var(--ink, #14111F); stroke-width: 2"></circle>
  </g></g></g></g>

  <sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
    <g>
      <rect x="70" y="156" width="132" height="54" rx="9" style="fill: var(--m-off, #FFD36B)"></rect>
      <path d="M64 150L44 134L76 126L94 150Z" style="fill: var(--m-box2, #EFEAFF); stroke: var(--ink, #14111F); stroke-width: 2.6; stroke-linejoin: round"></path>
      <path d="M196 150L216 134L184 126L166 150Z" style="fill: var(--m-box2, #EFEAFF); stroke: var(--ink, #14111F); stroke-width: 2.6; stroke-linejoin: round"></path>
      <rect x="64" y="150" width="132" height="54" rx="9" style="fill: var(--m-box, #fff); stroke: var(--ink, #14111F); stroke-width: 2.8"></rect>
      <rect x="112" y="167" width="36" height="9" rx="4.5" style="fill: none; stroke: var(--ink, #14111F); stroke-width: 2.4"></rect>
      <path class="spk" d="M36 96l2.4-5.6 5.6-2.4-5.6-2.4-2.4-5.6-2.4 5.6-5.6 2.4 5.6 2.4z" style="fill: var(--a, #FFC23D); --d: .2s"></path>
      <path class="spk" d="M232 112l2-4.6 4.6-2-4.6-2-2-4.6-2 4.6-4.6 2 4.6 2z" style="fill: var(--v, #6A4CF5); --d: 1s"></path>
      <text class="q" x="38" y="74">?</text>
      <text class="q" x="214" y="70" style="animation-delay: -1.1s">?</text>
    </g>
  </sc-if>

  <sc-if value="{{isNotice}}" hint-placeholder-val="{{false}}">
    <g>
      <rect x="168" y="112" width="22" height="26" rx="6" style="fill: var(--m-wing, #B9ACFF); stroke: var(--ink, #14111F); stroke-width: 2.6"></rect>
      <path d="M182 138L177 160" style="fill: none; stroke: var(--ink, #14111F); stroke-width: 7; stroke-linecap: round"></path>
      <path d="M182 138L177 160" style="fill: none; stroke: var(--a, #FFC23D); stroke-width: 3; stroke-linecap: round"></path>
      <path d="M190 114L232 92V156L190 136Z" style="fill: var(--a, #FFC23D); stroke: var(--ink, #14111F); stroke-width: 2.8; stroke-linejoin: round"></path>
      <ellipse cx="232" cy="124" rx="7" ry="32" style="fill: var(--m-box, #fff); stroke: var(--ink, #14111F); stroke-width: 2.8"></ellipse>
      <path class="arc" d="M246 104Q256 124 246 144" style="fill: none; stroke: var(--v, #6A4CF5); stroke-width: 3.6; stroke-linecap: round; --d: 0s"></path>
      <path class="arc" d="M254 92Q268 124 254 156" style="fill: none; stroke: var(--v, #6A4CF5); stroke-width: 3.6; stroke-linecap: round; --d: .25s"></path>
      <g class="spk" style="--d: .4s"><rect x="28" y="84" width="30" height="22" rx="5" transform="rotate(-10 43 95)" style="fill: var(--m-box, #fff); stroke: var(--ink, #14111F); stroke-width: 2.4"></rect><path d="M36 93h14M36 99h9" transform="rotate(-10 43 95)" style="fill: none; stroke: var(--ink, #14111F); stroke-width: 2.2; stroke-linecap: round"></path></g>
      <g class="spk" style="--d: 1.2s"><rect x="46" y="52" width="26" height="19" rx="5" transform="rotate(8 59 61)" style="fill: var(--m-box, #fff); stroke: var(--ink, #14111F); stroke-width: 2.4"></rect><path d="M53 60h12M53 65h7" transform="rotate(8 59 61)" style="fill: none; stroke: var(--ink, #14111F); stroke-width: 2.2; stroke-linecap: round"></path></g>
    </g>
  </sc-if>

  <sc-if value="{{isCoin}}" hint-placeholder-val="{{false}}">
    <g>
      <ellipse cx="62" cy="199" rx="24" ry="7.5" style="fill: var(--a, #FFC23D); stroke: var(--ink, #14111F); stroke-width: 2.6"></ellipse>
      <ellipse cx="62" cy="191" rx="24" ry="7.5" style="fill: var(--a, #FFC23D); stroke: var(--ink, #14111F); stroke-width: 2.6"></ellipse>
      <g class="coin"><circle cx="204" cy="160" r="31" style="fill: var(--a, #FFC23D); stroke: var(--ink, #14111F); stroke-width: 3"></circle><circle cx="204" cy="160" r="23" style="fill: none; stroke: var(--ink, #14111F); stroke-width: 1.8; opacity: .4; stroke-dasharray: 3 4"></circle><text x="204" y="171" text-anchor="middle" style="font: 800 31px var(--fd, 'Bricolage Grotesque', sans-serif); fill: #14111F">₹</text></g>
      <path class="spk" d="M236 116l2.6-6 6-2.6-6-2.6-2.6-6-2.6 6-6 2.6 6 2.6z" style="fill: var(--a, #FFC23D); --d: .1s"></path>
      <path class="spk" d="M168 128l2-4.6 4.6-2-4.6-2-2-4.6-2 4.6-4.6 2 4.6 2z" style="fill: var(--v, #6A4CF5); --d: 1.1s"></path>
    </g>
  </sc-if>

  <sc-if value="{{isBook}}" hint-placeholder-val="{{false}}">
    <g>
      <path d="M72 164Q104 156 136 170V212Q104 198 72 206Z" style="fill: var(--m-off, #FFD36B)"></path>
      <path d="M200 164Q168 156 136 170V212Q168 198 200 206Z" style="fill: var(--m-off, #FFD36B)"></path>
      <path d="M66 158Q98 150 130 164V206Q98 192 66 200Z" style="fill: var(--m-box, #fff); stroke: var(--ink, #14111F); stroke-width: 2.8; stroke-linejoin: round"></path>
      <path d="M194 158Q162 150 130 164V206Q162 192 194 200Z" style="fill: var(--m-box, #fff); stroke: var(--ink, #14111F); stroke-width: 2.8; stroke-linejoin: round"></path>
      <path d="M78 170Q98 166 118 175M78 180Q98 176 118 185M78 190Q98 186 108 191M182 170Q162 166 142 175M182 180Q162 176 142 185" style="fill: none; stroke: var(--ink, #14111F); stroke-width: 2.2; stroke-linecap: round; opacity: .35"></path>
      <text class="lt" x="60" y="110" style="--d: 0s">A</text>
      <text class="lt" x="206" y="96" style="--d: 1s">B</text>
      <text class="lt" x="182" y="64" style="--d: 2s">C</text>
    </g>
  </sc-if>

  <sc-if value="{{isLost}}" hint-placeholder-val="{{false}}">
    <g>
      <path d="M222 148L246 176" style="fill: none; stroke: var(--ink, #14111F); stroke-width: 13; stroke-linecap: round"></path>
      <path d="M222 148L246 176" style="fill: none; stroke: var(--a, #FFC23D); stroke-width: 7; stroke-linecap: round"></path>
      <circle cx="204" cy="128" r="24" style="fill: var(--m-box, #fff); fill-opacity: .55; stroke: var(--ink, #14111F); stroke-width: 4"></circle>
      <path d="M192 118Q197 111 205 111" style="fill: none; stroke: var(--ink, #14111F); stroke-width: 2.6; stroke-linecap: round; opacity: .45"></path>
    </g>
  </sc-if>

  <sc-if value="{{isWave}}" hint-placeholder-val="{{false}}">
    <g class="bub"><path d="M180 10h56a12 12 0 0 1 12 12v18a12 12 0 0 1-12 12h-30l-12 12 1-12h-15a12 12 0 0 1-12-12V22a12 12 0 0 1 12-12Z" style="fill: var(--m-box, #fff); stroke: var(--ink, #14111F); stroke-width: 2.6; stroke-linejoin: round"></path><text x="208" y="40" text-anchor="middle" style="font: 800 22px var(--fd, 'Bricolage Grotesque', sans-serif); fill: var(--ink, #14111F)">Hi!</text></g>
    <path class="spk" d="M44 70l2.4-5.6 5.6-2.4-5.6-2.4-2.4-5.6-2.4 5.6-5.6 2.4 5.6 2.4z" style="fill: var(--a, #FFC23D); --d: .3s"></path>
    <path class="spk" d="M236 130l2-4.6 4.6-2-4.6-2-2-4.6-2 4.6-4.6 2 4.6 2z" style="fill: var(--v, #6A4CF5); --d: 1.2s"></path>
  </sc-if>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"scene":{"editor":"enum","options":["wave","empty","notice","coin","book","lost","party"],"default":"wave"},"$preview":{"width":420,"height":360}}'>
var LABELS = { wave: 'Nesti the bird waving hello', empty: 'Nesti sitting in an empty box', notice: 'Nesti with a megaphone', coin: 'Nesti with a rupee coin', book: 'Nesti reading a book', lost: 'Nesti looking for something with a magnifying glass', party: 'Nesti celebrating' };
class Component extends DCLogic {
  renderVals() {
    var s = this.props.scene || 'wave';
    return {
      scene: s, label: LABELS[s] || LABELS.wave, dx: s === 'notice' ? -16 : s === 'coin' ? -14 : 0,
      isParty: s === 'party', isLost: s === 'lost', isEmpty: s === 'empty', isNotice: s === 'notice', isCoin: s === 'coin', isBook: s === 'book', isWave: s === 'wave',
      eyesOpen: s !== 'party', eyesHappy: s === 'party'
    };
  }
}
</script>
</body>
</html>
