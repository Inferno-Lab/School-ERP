name: phosphor_flutter
description: Vendored Phosphor icons (Regular, Bold, Fill) as plain IconData.
version: 2.1.0+edunest
publish_to: none

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

flutter:
  fonts:
    - family: PhosphorRegular
      fonts:
        - asset: lib/fonts/Phosphor.ttf
    - family: PhosphorBold
      fonts:
        - asset: lib/fonts/Phosphor-Bold.ttf
    - family: PhosphorFill
      fonts:
        - asset: lib/fonts/Phosphor-Fill.ttf
